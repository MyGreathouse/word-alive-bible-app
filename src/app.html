<title>Word Alive Bible</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Word Alive Bible Version (WABV): read, search and mark all 66 books.">
<link rel="icon" type="image/png" href="/*FAV*/">
<link rel="apple-touch-icon" href="/*ICON*/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Cormorant+Garamond:wght@600;700&display=swap">
<style>
/* Layout: sticky top bar (Book, Chapter, search, theme), one reading column, bottom tab bar (Home, Read, Search, Saved).
   Palette: ink navy + lamp gold on paper. Type: Cormorant (brand/headings), Source Serif 4 (scripture), Inter (interface). */
:root{
  --bg:#ffffff; --surface:#f4f6fa; --surface2:#e9edf5; --fg:#141b2d; --muted:#5b6479; --line:#d9deea;
  --accent:#1b2f5b; --gold:#9a6b00; --onaccent:#ffffff; --verse:#8a6414;
  --hl-y:#fff0a8; --hl-g:#cdeed3; --hl-b:#cfe3ff; --hl-p:#fbd3e4; --shadow:0 8px 30px rgba(20,27,45,.18);
  --scripture:'Source Serif 4','Iowan Old Style',Georgia,serif; --ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --brand:'Cormorant Garamond',Georgia,serif;
  --fs:19px;
}
@media (prefers-color-scheme: dark){:root:not([data-mode]):not([data-theme="light"]){
  --bg:#0e1424; --surface:#161d31; --surface2:#1f2842; --fg:#e8ebf3; --muted:#98a2ba; --line:#2a3454;
  --accent:#e0b44f; --gold:#e0b44f; --onaccent:#0e1424; --verse:#e0b44f;
  --hl-y:#5c4a0f; --hl-g:#1f4a2e; --hl-b:#1e3e6b; --hl-p:#5e2442; --shadow:0 8px 30px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]:not([data-mode]){
  --bg:#0e1424; --surface:#161d31; --surface2:#1f2842; --fg:#e8ebf3; --muted:#98a2ba; --line:#2a3454;
  --accent:#e0b44f; --gold:#e0b44f; --onaccent:#0e1424; --verse:#e0b44f;
  --hl-y:#5c4a0f; --hl-g:#1f4a2e; --hl-b:#1e3e6b; --hl-p:#5e2442; --shadow:0 8px 30px rgba(0,0,0,.6); color-scheme:dark}
:root[data-mode="daylight"]{color-scheme:light}
:root[data-mode="sepia"]{
  --bg:#f3e8d2; --surface:#eadcc0; --surface2:#e0cfae; --fg:#3a2c18; --muted:#7a6746; --line:#d4c19a;
  --accent:#6b3f12; --gold:#7a4b0a; --onaccent:#fff7e6; --verse:#8b5a14;
  --hl-y:#f3d46b; --hl-g:#b9d69a; --hl-b:#a9c7e6; --hl-p:#e8b4c6; color-scheme:light}
:root[data-mode="night"]{
  --bg:#0e1424; --surface:#161d31; --surface2:#1f2842; --fg:#e8ebf3; --muted:#98a2ba; --line:#2a3454;
  --accent:#e0b44f; --gold:#e0b44f; --onaccent:#0e1424; --verse:#e0b44f;
  --hl-y:#5c4a0f; --hl-g:#1f4a2e; --hl-b:#1e3e6b; --hl-p:#5e2442; --shadow:0 8px 30px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:46rem;margin:0 auto;position:relative}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;background:var(--surface);font-weight:600;font-size:14px;border:1px solid var(--line);min-width:0}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.pill:hover{background:var(--surface2)}
.sp{flex:1}
.ic{width:38px;height:38px;border-radius:19px;display:inline-grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--bg);flex:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"] svg{stroke-width:2.2}
/* reader */
.reader{padding-block:22px 36px}
.rh{text-align:center;margin-bottom:18px}
.rh .bk{font-family:var(--brand);font-weight:700;font-size:2.1rem;line-height:1.1;letter-spacing:.01em;text-wrap:balance}
.rh .ch{font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.vs{font-family:var(--scripture);font-size:var(--fs);line-height:1.62;margin:0 0 .5em;padding:2px 6px;border-radius:6px;cursor:pointer;text-wrap:pretty;position:relative}
.vs:hover{background:var(--surface)}
.vs sup{font-family:var(--ui);font-size:.55em;font-weight:600;color:var(--verse);margin-right:.35em;vertical-align:super;line-height:0}
.vs.poem{white-space:pre-line}
.vs.poem .ln{display:block;padding-left:1.4em;text-indent:-1.4em}
.vs.note{font-style:italic;color:var(--muted);font-size:calc(var(--fs) - 2px);cursor:default}
.vs.note:hover{background:none}
.vs.sec{font-family:var(--ui);font-style:normal;font-weight:600;color:var(--fg);font-size:15px;margin-top:1.4em;cursor:default;border-top:1px solid var(--line);padding-top:12px}
.vs.sel{outline:2px solid var(--accent);outline-offset:1px}
.vs[data-h="y"]{background:var(--hl-y)}.vs[data-h="g"]{background:var(--hl-g)}.vs[data-h="b"]{background:var(--hl-b)}.vs[data-h="p"]{background:var(--hl-p)}
.vs[data-bm="1"]::after{content:"";position:absolute;right:2px;top:-1px;width:9px;height:15px;background:var(--gold);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.nav button{flex:1;height:46px;border-radius:23px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.nav button:hover{background:var(--surface2)}
.nav button[disabled]{opacity:.35;cursor:default}
/* home */
.home{padding-block:26px 32px}
.hero{text-align:center;padding:30px 0 20px}
.hero .mk{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font-family:var(--brand);font-weight:700;font-size:2.1rem}
.hero h1{font-family:var(--brand);font-size:2.7rem;margin:0;line-height:1;letter-spacing:.01em}
.hero p{margin:8px 0 0;color:var(--muted);font-size:14px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 18px;margin-top:16px}
.card h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.cont b{font-family:var(--brand);font-size:1.5rem;display:block;line-height:1.1}
.cont small{color:var(--muted)}
.go{margin-left:auto;height:38px;padding:0 18px;border-radius:19px;background:var(--accent);color:var(--onaccent);font-weight:600;display:inline-flex;align-items:center}
.votd q{font-family:var(--scripture);font-size:1.2rem;line-height:1.5;quotes:"\201C" "\201D";display:block}
.votd .ref{margin-top:10px;font-weight:600;color:var(--verse);font-size:13px}
.votd .row{display:flex;gap:8px;margin-top:12px}
.sm{height:34px;padding:0 14px;border-radius:17px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600}
.sm:hover{background:var(--surface2)}
.tag{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.chip{height:34px;padding:0 14px;border-radius:17px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;line-height:1.6}
/* search */
.find{padding-block:16px 28px}
.sb{position:relative}
.sb input{width:100%;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 18px;font:inherit;font-size:16px}
.scope{display:flex;gap:8px;margin:12px 0}
.scope button{height:32px;padding:0 12px;white-space:nowrap;border-radius:16px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--bg)}
.scope button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.cnt{color:var(--muted);font-size:13px;margin:4px 0 10px}
.res{display:block;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.res:hover{background:var(--surface)}
.res .r{font-weight:600;font-size:13px;color:var(--verse);margin-bottom:3px}
.res .t{font-family:var(--scripture);font-size:16px;line-height:1.5}
mark{background:var(--hl-y);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);text-align:center;padding:34px 10px;line-height:1.6}
/* saved */
.saved{padding-block:16px 30px}
.seg{display:flex;gap:8px;margin-bottom:12px}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(8,12,22,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:46rem;max-height:86%;border-radius:20px 20px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh{display:flex;align-items:center;justify-content:space-between;padding-block:14px 8px;font-weight:600}
.sh h3{margin:0;font-family:var(--brand);font-size:1.5rem}
.sb2{overflow-y:auto;padding-block:4px 20px}
.sec2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.grid button{height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid button:hover{background:var(--surface2)}
.grid button[aria-current="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.grid.ch{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.act button{height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.act button:hover{background:var(--surface2)}
.sw{display:flex;gap:12px;margin-top:6px}
.sw button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line)}
.sw button[data-c="y"]{background:var(--hl-y)}.sw button[data-c="g"]{background:var(--hl-g)}.sw button[data-c="b"]{background:var(--hl-b)}.sw button[data-c="p"]{background:var(--hl-p)}
.sw button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.quote{font-family:var(--scripture);font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 6px}
.opt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.opt button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.rng{display:flex;align-items:center;gap:12px}
.rng input{flex:1;accent-color:var(--accent)}
.vs[data-x="1"] sup::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--accent);margin-left:2px;vertical-align:super;position:relative;top:-1px}
.refs{padding-block:16px 30px}
.rhd{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;margin:12px 0}
.rhd b{font-family:var(--brand);font-size:1.5rem;display:block;line-height:1.1}
.rhd p{margin:6px 0 0;font-family:var(--scripture);font-size:15px;line-height:1.5;color:var(--muted)}
.rhd .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ritem{display:flex;gap:8px;align-items:stretch;border-bottom:1px solid var(--line)}
.ritem .res{border:0;flex:1;min-width:0}
.ritem .ex{flex:none;width:44px;color:var(--muted);font-size:20px}
.ritem .ex:hover{background:var(--surface)}
.pass{font-size:12px;color:var(--muted);margin:14px 0 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.herop{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.tsec{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.tsec summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px;color:#f3e8d2;background:linear-gradient(135deg,#0e1424 0%,#1b2848 60%,#3a2d12 130%)}
.tsec summary::-webkit-details-marker{display:none}
.tsec .mk2{width:46px;height:46px;border-radius:12px;flex:none}
.tsec summary b{font-family:var(--brand);font-size:1.6rem;line-height:1.05;display:block;color:#e0b44f}
.tsec summary small{color:#c9cfdf;font-size:12.5px}
.tsec summary .chev{margin-left:auto;transition:transform .15s}
.tsec[open] summary .chev{transform:rotate(180deg)}
.tsec .body{padding:6px 16px 16px}
.tsec .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.tsec .grid button{background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
.ldg{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>
<div class="app" id="app">
  <header class="top gut">
    <button class="pill" id="bBook" aria-label="Choose book"><span id="tBook">Genesis</span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4l4 4 4-4"/></svg></button>
    <button class="pill" id="bCh" aria-label="Choose chapter"><span id="tCh">1</span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4l4 4 4-4"/></svg></button>
    <span class="sp"></span>
    <button class="ic" id="bTheme" aria-label="Switch daylight or night"><svg id="icTheme" viewBox="0 0 24 24"></svg></button>
    <button class="ic" id="bSet" aria-label="Reading settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>
  <main class="main" id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-t="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-t="read"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6zM12 6v14"/></svg>Read</button>
    <button data-t="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Search</button>
    <button data-t="saved"><svg viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg>Saved</button>
    <button data-t="refs"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Refs</button>
  </nav>
</div>

var S={tab:"home",bi:0,ci:0,fs:ls("wab.fs",19),mode:ls("wab.mode","auto"),pos:ls("wab.pos",null),hl:ls("wab.hl",{}),bm:ls("wab.bm",{}),sel:null,q:"",scope:"all",seg:"bm",rv:null,rq:"",rst:[]};

  var h="read-"+B[b].s+"-"+(c+1);if(push!==false&&location.hash!=="#"+h)location.hash=h;

  var fwd=refsFor(rv.b,rv.c,rv.v);
  w.appendChild(el("div","sec2","Cross references ("+fwd.length+")"));
  if(!fwd.length)w.appendChild(el("div","empty","No cross references are listed for this passage."));
  rows.forEach(function(r){
    var f=r[4];if(!f.length)return;
    w.appendChild(el("div","pass","Passage "+rangeLabel(rv.b,r[0],r[1],r[2],r[3]).replace(B[rv.b].n+" ","")+" \u00B7 "+(f.length/5)+" references"));
    for(var i=0;i<f.length;i+=5){var t=f.slice(i,i+5);w.appendChild(item(rangeLabel(t[0],t[1],t[2],t[3],t[4]),rangeText(t[0],t[1],t[2],t[3],t[4]),t[0],t[1],t[2],t[3],t[4]))}
    if(r[5])w.appendChild(el("div","cnt","Also cited (outside the 66 books): "+r[5].join("; ")));
  });
  var by=refsBy(rv.b,rv.c,rv.v);
  w.appendChild(el("div","sec2","Referenced by ("+by.length+")"));
  if(!by.length)w.appendChild(el("div","empty","No other passage points to this verse."));
  by.slice(0,60).forEach(function(e){w.appendChild(item(rangeLabel(e[0],e[1],e[2],e[3],e[4]),rangeText(e[0],e[1],e[2],e[3],e[4]),e[0],e[1],e[2],e[3],e[4]))});
  if(by.length>60)w.appendChild(el("div","cnt","Showing the first 60 of "+by.length+"."));
  var cr=(R[rv.b]||[]).filter(function(r){return r[0]<=rv.c+1&&r[2]>=rv.c+1&&r[4].length});
  if(cr.length){w.appendChild(el("div","sec2","In "+B[rv.b].n+(B[rv.b].c.length>1?" "+(rv.c+1):"")));
    var g=el("div","tag");var seen={};
    cr.forEach(function(r){var lbl=rangeLabel(rv.b,r[0],r[1],r[2],r[3]).replace(B[rv.b].n+" ","");if(seen[lbl])return;seen[lbl]=1;var b=el("button","chip",lbl);b.onclick=function(){setRv({b:rv.b,c:Math.max(r[0],rv.c+1)-1,v:r[0]===rv.c+1?r[1]:1},true)};g.appendChild(b)});
    w.appendChild(g)}
  main.replaceChildren(w);main.scrollTop=0;
}
function render(top){
  [].forEach.call(document.querySelectorAll("#tabs button"),function(b){if(b.dataset.t===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(S.tab==="read")renderRead();else if(S.tab==="find")renderFind();else if(S.tab==="saved")renderSaved();else if(S.tab==="refs")renderRefs();else renderHome();
  if(top)main.scrollTop=0;
}
function fromHash(){
  var h=location.hash.replace(/^#/,"");var m=h.match(/^read-([a-z0-9]+)-(\d+)$/);
  if(m){var b=bookIdx(m[1]);if(b>=0){var c=Math.min(Math.max(+m[2],1),B[b].c.length)-1;S.bi=b;S.ci=c;S.tab="read";S.pos={b:B[b].s,c:c+1};ss("wab.pos",S.pos);render(true);return}}
  if(h==="refs"&&!S.rv)S.rv={b:S.bi,c:S.ci,v:firstV(S.bi,S.ci)};
  if(h==="find"||h==="saved"||h==="home"||h==="refs"){S.tab=h;render(false);return}
  if(h==="read"){S.tab="read";render(true);return}
  S.tab="home";render(false);
}
window.addEventListener("hashchange",fromHash);
document.addEventListener("keydown",function(e){if(S.tab!=="read"||document.querySelector(".ov")||e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"){var N=nextOf(S.bi,S.ci);if(N)go(N[0],N[1])}else if(e.key==="ArrowLeft"){var P=prevOf(S.bi,S.ci);if(P)go(P[0],P[1])}});
if(S.pos){var pb=bookIdx(S.pos.b);if(pb>=0){S.bi=pb;S.ci=Math.min(S.pos.c,B[pb].c.length)-1}}
applyMode();fromHash();
})();
</script>
